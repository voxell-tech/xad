path = "../examples/bezier_single.rs"

[[example]]
name = "bezier_multi"
path = "../examples/bezier_multi.rs"

[[example]]
name = "bezier_realtime"
path = "../examples/bezier_realtime.rs"

[[example]]
name = "bezier_sketch"
path = "../examples/bezier_sketch.rs"